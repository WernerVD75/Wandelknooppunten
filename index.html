<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wandelnetwerk Planner & Spraaknavigatie</title>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- PapaParse voor snel inlezen van CSV/TXT -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; height: 100vh; }
    
    #controls {
      padding: 10px 14px;
      background-color: #f8f9fa;
      border-bottom: 1px solid #ddd;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      z-index: 1000;
    }

    button {
      padding: 7px 12px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    select {
      padding: 6px 10px;
      font-size: 13px;
      border-radius: 6px;
      border: 1px solid #ccc;
      background: white;
      max-width: 200px;
    }

    .btn-success { background-color: #28a745; color: white; }
    .btn-primary { background-color: #007bff; color: white; }
    .btn-danger { background-color: #dc3545; color: white; }
    .btn-secondary { background-color: #6c757d; color: white; }

    #info { font-size: 14px; font-weight: bold; color: #333; margin-left: auto; }
    #status { font-size: 13px; color: #28a745; font-weight: 600; width: 100%; margin-top: 4px; }
    #map { flex: 1; width: 100%; }

    .wandel-badge {
      background-color: #28a745;
      color: white;
      border: 2px solid white;
      border-radius: 50%;
      text-align: center;
      font-weight: bold;
      font-size: 12px;
      line-height: 24px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>

  <div id="controls">
    <button id="btn-start" class="btn-success" onclick="startNavigatie()">▶ Start Navigatie</button>
    <button id="btn-stop" class="btn-danger" onclick="stopNavigatie()" style="display:none;">⏹ Stop Navigatie</button>
    
    <button class="btn-primary" onclick="slaRouteOp()">💾 Route Opslaan</button>
    
    <!-- Selectieknop voor opgeslagen routes -->
    <select id="saved-routes-select" onchange="laadOpgeslagenRoute(this.value)">
      <option value="">-- Opgeslagen routes --</option>
    </select>
    <button class="btn-danger" onclick="verwijderOpgeslagenRoute()" title="Geselecteerde opgeslagen route verwijderen">🗑️</button>

    <button class="btn-secondary" onclick="undoLast()">Laatste punt wissen</button>
    <button class="btn-danger" onclick="clearAll()">Alles wissen</button>

    <span id="info">Wandelknooppunten: 0 | 0.0 km</span>
    <div id="status">Wandelknooppunten laden...</div>
  </div>

  <div id="map"></div>

  <script>
    const map = L.map('map').setView([51.318, 4.858], 13);

    // Standaard kaart
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // Wandelnetwerken overlay (Waymarked Trails)
    L.tileLayer('https://tile.waymarkedtrails.org/hiking/{z}/{x}/{y}.png', {
      maxZoom: 19,
      opacity: 0.8,
      attribution: '© Waymarked Trails'
    }).addTo(map);

    let allNodes = [];
    let waypoints = [];       
    let routeSegments = [];   
    let markers = [];         
    let polylineGroup = L.featureGroup().addTo(map);
    let currentDistanceKm = "0.0";
    
    let userMarker = null;
    let watchId = null;
    let lastInstruction = "";

    // Inladen van BE en NL wandelknooppunten
    const files = ["wandelknooppuntenbe.txt", "wandelknooppuntennl.txt"];

    async function laadWandelknooppunten() {
      let geladen = 0;
      for (const f of files) {
        try {
          const res = await fetch(f);
          if (!res.ok) continue;
          const text = await res.text();
          Papa.parse(text, {
            skipEmptyLines: true,
            complete: function(results) {
              const nodes = results.data.map(row => ({
                lon: parseFloat(row[0]),
                lat: parseFloat(row[1]),
                ref: row[2] ? row[2].toString().trim() : ''
              })).filter(n => !isNaN(n.lat) && !isNaN(n.lon));
              
              allNodes = allNodes.concat(nodes);
              geladen += nodes.length;
              document.getElementById('status').innerText = `✔ ${geladen.toLocaleString()} wandelknooppunten geladen. Klik op een knooppunt...`;
            }
          });
        } catch(e) {}
      }
      verversOpgeslagenRoutesLijst();
    }

    laadWandelknooppunten();

    // Klikken op een knooppunt
    map.on('click', async function(e) {
      if (allNodes.length === 0) return;

      const node = findClosestNode(e.latlng.lat, e.latlng.lng);
      if (!node) {
        document.getElementById('status').innerText = '❌ Geen wandelknooppunt dichtbij gevonden.';
        return;
      }

      if (waypoints.length > 0 && waypoints[waypoints.length - 1].ref === node.ref && 
          waypoints[waypoints.length - 1].lat === node.lat) return;

      waypoints.push(node);

      const customIcon = L.divIcon({
        className: 'wandel-badge',
        html: node.ref,
        iconSize: [26, 26],
        iconAnchor: [13, 13]
      });

      const marker = L.marker([node.lat, node.lon], { icon: customIcon }).addTo(map);
      markers.push(marker);

      if (waypoints.length > 1) {
        document.getElementById('status').innerText = `Wandelpad berekenen naar knooppunt ${node.ref}...`;
        const start = waypoints[waypoints.length - 2];
        const end = waypoints[waypoints.length - 1];
        
        const segmentCoords = await fetchWalkingRoute(start, end);
        routeSegments.push(segmentCoords);
      }

      updateMap();
    });

    function findClosestNode(lat, lng) {
      let closest = null;
      let minDistance = Infinity;
      for (let i = 0; i < allNodes.length; i++) {
        const node = allNodes[i];
        const dist = L.latLng(lat, lng).distanceTo(L.latLng(node.lat, node.lon));
        if (dist < minDistance) {
          minDistance = dist;
          closest = node;
        }
      }
      return minDistance < 400 ? closest : null;
    }

    // BRouter Routing over wandelpaden
    async function fetchWalkingRoute(startNode, endNode) {
      const brouterUrl = `https://brouter.de/brouter?lonlats=${startNode.lon},${startNode.lat}|${endNode.lon},${endNode.lat}&profile=foot&format=geojson`;

      try {
        const response = await fetch(brouterUrl);
        const data = await response.json();

        if (data.features && data.features.length > 0) {
          const coords = data.features[0].geometry.coordinates;
          return coords.map(c => [c[1], c[0]]);
        }
      } catch (err) {}

      // Fallback OSRM Foot
      const osrmUrl = `https://router.project-osrm.org/route/v1/foot/${startNode.lon},${startNode.lat};${endNode.lon},${endNode.lat}?overview=full&geometries=geojson`;
      try {
        const response = await fetch(osrmUrl);
        const data = await response.json();
        if (data.routes && data.routes.length > 0) {
          return data.routes[0].geometry.coordinates.map(coord => [coord[1], coord[0]]);
        }
      } catch (err) {}

      return [[startNode.lat, startNode.lon], [endNode.lat, endNode.lon]];
    }

    function updateMap() {
      polylineGroup.clearLayers();
      let totalDistanceMeters = 0;

      routeSegments.forEach(segment => {
        const line = L.polyline(segment, { color: '#28a745', weight: 6, opacity: 0.85 });
        polylineGroup.addLayer(line);
      });

      const fullPath = getFullTrackPoints();
      for (let i = 0; i < fullPath.length - 1; i++) {
        totalDistanceMeters += L.latLng(fullPath[i]).distanceTo(L.latLng(fullPath[i + 1]));
      }

      currentDistanceKm = (totalDistanceMeters / 1000).toFixed(1);
      const lastWp = waypoints[waypoints.length - 1];
      
      document.getElementById('info').innerText = `Wandelknooppunten: ${waypoints.length} | ${currentDistanceKm} km`;
      if (waypoints.length > 0) {
        document.getElementById('status').innerText = `✔ Knooppunt ${lastWp.ref} toegevoegd.`;
      }
    }

    function getFullTrackPoints() {
      if (waypoints.length === 0) return [];
      let fullPath = [];
      routeSegments.forEach((segment, index) => {
        fullPath = fullPath.concat(index === 0 ? segment : segment.slice(1));
      });
      return fullPath;
    }

    function undoLast() {
      if (waypoints.length === 0) return;
      waypoints.pop();
      const lastMarker = markers.pop();
      map.removeLayer(lastMarker);
      if (routeSegments.length > 0) routeSegments.pop();
      updateMap();
    }

    function clearAll() {
      waypoints = [];
      routeSegments = [];
      markers.forEach(m => map.removeLayer(m));
      markers = [];
      updateMap();
      document.getElementById('info').innerText = `Wandelknooppunten: 0 | 0.0 km`;
      document.getElementById('status').innerText = `Kaart leeggemaakt.`;
    }

    // --- ROUTE OPSLAAN EN LADEN LOGICA ---

    function getOpgeslagenRoutes() {
      const data = localStorage.getItem('wandel_routes');
      return data ? JSON.parse(data) : {};
    }

    function slaRouteOp() {
      if (waypoints.length < 2) {
        alert("Maak eerst een route van minstens 2 knooppunten voordat je opslaat.");
        return;
      }

      const knooppuntenReeks = waypoints.map(w => w.ref).join('-');
      const standaardNaam = `Wandeling (${knooppuntenReeks}) - ${currentDistanceKm} km`;
      
      const routeNaam = prompt("Geef een naam voor deze wandelroute:", standaardNaam);
      if (!routeNaam || routeNaam.trim() === "") return;

      const routes = getOpgeslagenRoutes();
      routes[routeNaam.trim()] = {
        waypoints: waypoints,
        routeSegments: routeSegments,
        distanceKm: currentDistanceKm
      };

      localStorage.setItem('wandel_routes', JSON.stringify(routes));
      verversOpgeslagenRoutesLijst();
      document.getElementById('saved-routes-select').value = routeNaam.trim();
      alert(`Route "${routeNaam}" is succesvol opgeslagen!`);
    }

    function verversOpgeslagenRoutesLijst() {
      const select = document.getElementById('saved-routes-select');
      select.innerHTML = '<option value="">-- Opgeslagen routes --</option>';
      const routes = getOpgeslagenRoutes();

      for (const naam in routes) {
        const option = document.createElement('option');
        option.value = naam;
        option.textContent = `${naam} (${routes[naam].distanceKm} km)`;
        select.appendChild(option);
      }
    }

    function laadOpgeslagenRoute(naam) {
      if (!naam) return;
      const routes = getOpgeslagenRoutes();
      const route = routes[naam];
      if (!route) return;

      clearAll();

      waypoints = route.waypoints;
      routeSegments = route.routeSegments;

      // Markers terug op kaart zetten
      waypoints.forEach(node => {
        const customIcon = L.divIcon({
          className: 'wandel-badge',
          html: node.ref,
          iconSize: [26, 26],
          iconAnchor: [13, 13]
        });
        const marker = L.marker([node.lat, node.lon], { icon: customIcon }).addTo(map);
        markers.push(marker);
      });

      updateMap();

      // Zoom naar de ingeladen route
      if (markers.length > 0) {
        const group = L.featureGroup(markers);
        map.fitBounds(group.getBounds().pad(0.2));
      }

      document.getElementById('status').innerText = `✔ Route "${naam}" geladen!`;
    }

    function verwijderOpgeslagenRoute() {
      const select = document.getElementById('saved-routes-select');
      const naam = select.value;
      if (!naam) {
        alert("Selecteer eerst een opgeslagen route uit de lijst om te verwijderen.");
        return;
      }

      if (confirm(`Weet je zeker dat je "${naam}" wilt verwijderen?`)) {
        const routes = getOpgeslagenRoutes();
        delete routes[naam];
        localStorage.setItem('wandel_routes', JSON.stringify(routes));
        verversOpgeslagenRoutesLijst();
        clearAll();
        document.getElementById('status').innerText = `Route verwijderd.`;
      }
    }

    // --- SPRAAKNAVIGATIE LOGICA ---

    function spreek(tekst) {
      if ('speechSynthesis' in window && tekst !== lastInstruction) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(tekst);
        utterance.lang = 'nl-NL';
        utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
        lastInstruction = tekst;
        document.getElementById('status').innerText = `🗣️ ${tekst}`;
      }
    }

    let huidigKnooppuntIndex = 1;

    function startNavigatie() {
      if (waypoints.length < 2) {
        alert("Kies of laad eerst een route om de navigatie te starten.");
        return;
      }

      huidigKnooppuntIndex = 1;
      document.getElementById('btn-start').style.display = 'none';
      document.getElementById('btn-stop').style.display = 'inline-block';

      spreek(`Start navigatie. Wandel naar knooppunt ${waypoints[0].ref}`);

      watchId = navigator.geolocation.watchPosition(updatePositie, (err) => {
        alert("Kan GPS-signaal niet ophalen.");
      }, { enableHighAccuracy: true, maximumAge: 1000, timeout: 5000 });
    }

    function stopNavigatie() {
      if (watchId) navigator.geolocation.clearWatch(watchId);
      document.getElementById('btn-start').style.display = 'inline-block';
      document.getElementById('btn-stop').style.display = 'none';
      spreek("Navigatie gestopt.");
    }

    function updatePositie(pos) {
      const uLat = pos.coords.latitude;
      const uLon = pos.coords.longitude;
      const heading = pos.coords.heading;

      if (!userMarker) {
        userMarker = L.marker([uLat, uLon]).addTo(map);
      } else {
        userMarker.setLatLng([uLat, uLon]);
      }

      if (huidigKnooppuntIndex >= waypoints.length) {
        spreek("Je hebt de eindbestemming bereikt!");
        stopNavigatie();
        return;
      }

      const doelNode = waypoints[huidigKnooppuntIndex];
      const afstand = L.latLng(uLat, uLon).distanceTo(L.latLng(doelNode.lat, doelNode.lon));

      if (afstand < 15) {
        huidigKnooppuntIndex++;
        const volgendPunt = waypoints[huidigKnooppuntIndex];
        if (volgendPunt) {
          spreek(`Knooppunt ${doelNode.ref} bereikt. Vervolg de wandelroute naar knooppunt ${volgendPunt.ref}`);
        }
        return;
      }

      if (afstand < 40 && heading !== null && !isNaN(heading)) {
        const dLat = (doelNode.lat - uLat) * Math.PI / 180;
        const dLon = (doelNode.lon - uLon) * Math.PI / 180;
        const y = Math.sin(dLon) * Math.cos(doelNode.lat * Math.PI / 180);
        const x = Math.cos(uLat * Math.PI / 180) * Math.sin(doelNode.lat * Math.PI / 180) - Math.sin(uLat * Math.PI / 180) * Math.cos(doelNode.lat * Math.PI / 180) * Math.cos(dLon);
        const doelKoers = (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;

        let hoek = (doelKoers - heading + 360) % 360;

        if (hoek > 45 && hoek < 135) {
          spreek(`Over ${Math.round(afstand)} meter rechtsaf wandelpad op naar knooppunt ${doelNode.ref}`);
        } else if (hoek > 225 && hoek < 315) {
          spreek(`Over ${Math.round(afstand)} meter linksaf wandelpad op naar knooppunt ${doelNode.ref}`);
        }
      }
    }
  </script>
</body>
</html>
