<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wandelroute Planner & Spraaknavigatie</title>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- PapaParse voor het inlezen van TXT/CSV -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; height: 100vh; }
    
    #controls {
      padding: 10px;
      background-color: #f8f9fa;
      border-bottom: 1px solid #ddd;
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      z-index: 1000;
    }

    button {
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    select {
      padding: 7px;
      font-size: 13px;
      border-radius: 6px;
      border: 1px solid #ccc;
      background: white;
      max-width: 160px;
    }

    .btn-success { background-color: #28a745; color: white; }
    .btn-primary { background-color: #007bff; color: white; }
    .btn-danger { background-color: #dc3545; color: white; }
    .btn-secondary { background-color: #6c757d; color: white; }

    #info { font-size: 13px; font-weight: bold; color: #333; margin-left: auto; }
    #status { font-size: 12px; color: #28a745; font-weight: 600; width: 100%; margin-top: 4px; }
    #map { flex: 1; width: 100%; }

    .wandel-badge {
      background-color: #28a745;
      color: white;
      border: 2px solid white;
      border-radius: 50%;
      text-align: center;
      font-weight: bold;
      font-size: 11px;
      line-height: 24px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>

  <div id="controls">
    <button id="btn-start" class="btn-success" onclick="startNavigatie()">▶ Start Navigatie</button>
    <button id="btn-stop" class="btn-danger" onclick="stopNavigatie()" style="display:none;">⏹ Stop Navigatie</button>
    
    <button class="btn-primary" onclick="slaRouteOp()">💾 Opslaan</button>
    
    <select id="saved-routes-select" onchange="laadOpgeslagenRoute(this.value)">
      <option value="">-- Routes --</option>
    </select>
    <button class="btn-danger" onclick="verwijderOpgeslagenRoute()">🗑</button>

    <button class="btn-secondary" onclick="undoLast()">Herstel</button>
    <button class="btn-danger" onclick="clearAll()">Wis</button>

    <span id="info">0 km</span>
    <div id="status">Wandelknooppunten laden...</div>
  </div>

  <div id="map"></div>

  <script>
    const map = L.map('map', { tap: true }).setView([51.318, 4.858], 13);

    // Achtergrondkaart (OpenStreetMap)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // Wandelknooppunten-overlay (Rode lijnen van Waymarked Trails)
    L.tileLayer('https://tile.waymarkedtrails.org/hiking/{z}/{x}/{y}.png', {
      maxZoom: 19,
      opacity: 0.7,
      attribution: '© Waymarked Trails'
    }).addTo(map);

    let allNodes = [];
    let waypoints = [];       
    let routeSegments = [];   
    let markers = [];         
    let polylineGroup = L.featureGroup().addTo(map);
    let currentDistanceKm = "0.0";
    
    let userMarker = null;
    let watchId = null;

    const files = ["./wandelknooppuntenbe.txt", "./wandelknooppuntennl.txt"];

    function parseFile(fileUrl) {
      return new Promise((resolve) => {
        Papa.parse(fileUrl, {
          download: true,
          skipEmptyLines: true,
          complete: function(results) {
            if (results && results.data) {
              const nodes = results.data.map(row => ({
                lon: parseFloat(row[0]),
                lat: parseFloat(row[1]),
                ref: row[2] ? row[2].toString().trim() : ''
              })).filter(n => !isNaN(n.lat) && !isNaN(n.lon));
              resolve(nodes);
            } else {
              resolve([]);
            }
          },
          error: function() { resolve([]); }
        });
      });
    }

    async function laadWandelknooppunten() {
      document.getElementById('status').innerText = "⏳ Knooppunten inladen...";
      allNodes = [];

      for (const f of files) {
        const nodes = await parseFile(f);
        allNodes = allNodes.concat(nodes);
      }

      if (allNodes.length > 0) {
        document.getElementById('status').innerText = `✔ ${allNodes.length.toLocaleString()} knooppunten geladen. Tik op de kaart.`;
      } else {
        document.getElementById('status').innerText = `❌ Kon de TXT-bestanden niet laden.`;
      }
      
      verversOpgeslagenRoutesLijst();
    }

    laadWandelknooppunten();

    map.on('click', async function(e) {
      if (allNodes.length === 0) return;

      const node = findClosestNode(e.latlng.lat, e.latlng.lng);
      if (!node) {
        document.getElementById('status').innerText = '❌ Geen knooppunt dichtbij gevonden (binnen 500m).';
        return;
      }

      if (waypoints.length > 0 && waypoints[waypoints.length - 1].ref === node.ref && 
          waypoints[waypoints.length - 1].lat === node.lat) return;

      waypoints.push(node);

      const customIcon = L.divIcon({
        className: 'wandel-badge',
        html: node.ref,
        iconSize: [26, 26],
        iconAnchor: [13, 13]
      });

      const marker = L.marker([node.lat, node.lon], { icon: customIcon }).addTo(map);
      markers.push(marker);

      if (waypoints.length > 1) {
        document.getElementById('status').innerText = `Wandelnetwerk zoeken naar knooppunt ${node.ref}...`;
        const start = waypoints[waypoints.length - 2];
        const end = waypoints[waypoints.length - 1];
        
        const segmentCoords = await fetchWalkingRoute(start, end);
        routeSegments.push(segmentCoords);
      }

      updateMap();
    });

    function findClosestNode(lat, lng) {
      let closest = null;
      let minDistance = Infinity;
      for (let i = 0; i < allNodes.length; i++) {
        const node = allNodes[i];
        const dist = L.latLng(lat, lng).distanceTo(L.latLng(node.lat, node.lon));
        if (dist < minDistance) {
          minDistance = dist;
          closest = node;
        }
      }
      return minDistance < 500 ? closest : null;
    }

    // --- EXACT WANDELNETWERK VOLGEN VIA OVERPASS API (RODE LIJNEN) ---
    async function fetchWalkingRoute(startNode, endNode) {
      // 1. Zoek het officiële wandelnetwerk-traject (de rode lijn op de kaart)
      const overpassQuery = `
        [out:json][timeout:10];
        (
          relation["network"="rwn"]["type"="route"](around:300, ${startNode.lat}, ${startNode.lon});
          relation["network"="lwn"]["type"="route"](around:300, ${startNode.lat}, ${startNode.lon});
        );
        out body;
        >;
        out skel qt;
      `;
      
      try {
        const response = await fetch('https://overpass-api.de/api/interpreter', {
          method: 'POST',
          body: 'data=' + encodeURIComponent(overpassQuery)
        });

        if (response.ok) {
          const data = await response.json();
          
          const nodesMap = {};
          data.elements.forEach(el => {
            if (el.type === 'node') nodesMap[el.id] = [el.lat, el.lon];
          });

          const ways = data.elements.filter(el => el.type === 'way');
          
          for (const way of ways) {
            if (!way.nodes) continue;
            const coords = way.nodes.map(nid => nodesMap[nid]).filter(c => c !== undefined);
            
            if (coords.length > 1) {
              const firstDist = L.latLng(coords[0]).distanceTo(L.latLng(startNode.lat, startNode.lon));
              const lastDist = L.latLng(coords[coords.length - 1]).distanceTo(L.latLng(endNode.lat, endNode.lon));
              
              const firstDistRev = L.latLng(coords[0]).distanceTo(L.latLng(endNode.lat, endNode.lon));
              const lastDistRev = L.latLng(coords[coords.length - 1]).distanceTo(L.latLng(startNode.lat, startNode.lon));

              if ((firstDist < 150 && lastDist < 150)) {
                return coords;
              } else if (firstDistRev < 150 && lastDistRev < 150) {
                return coords.reverse();
              }
            }
          }
        }
      } catch (e) {
        console.warn("Overpass netwerk mislukt, fallback naar OSRM.");
      }

      // 2. Fallback: OSRM voetgangersmodus als overpass niks vind
      const osrmUrl = `https://router.project-osrm.org/route/v1/foot/${startNode.lon},${startNode.lat};${endNode.lon},${endNode.lat}?overview=full&geometries=geojson`;
      try {
        const response = await fetch(osrmUrl);
        if (response.ok) {
          const data = await response.json();
          if (data.routes && data.routes.length > 0) {
            return data.routes[0].geometry.coordinates.map(coord => [coord[1], coord[0]]);
          }
        }
      } catch (err) {}

      return [[startNode.lat, startNode.lon], [endNode.lat, endNode.lon]];
    }

    function updateMap() {
      polylineGroup.clearLayers();
      let totalDistanceMeters = 0;

      routeSegments.forEach(segment => {
        const line = L.polyline(segment, { color: '#28a745', weight: 6, opacity: 0.85 });
        polylineGroup.addLayer(line);
      });

      const fullPath = getFullTrackPoints();
      for (let i = 0; i < fullPath.length - 1; i++) {
        totalDistanceMeters += L.latLng(fullPath[i]).distanceTo(L.latLng(fullPath[i + 1]));
      }

      currentDistanceKm = (totalDistanceMeters / 1000).toFixed(1);
      const lastWp = waypoints[waypoints.length - 1];
      
      document.getElementById('info').innerText = `${waypoints.length} knooppunten | ${currentDistanceKm} km`;
      if (waypoints.length > 0) {
        document.getElementById('status').innerText = `✔ Knooppunt ${lastWp.ref} toegevoegd.`;
      }
    }

    function getFullTrackPoints() {
      if (waypoints.length === 0) return [];
      let fullPath = [];
      routeSegments.forEach((segment, index) => {
        fullPath = fullPath.concat(index === 0 ? segment : segment.slice(1));
      });
      return fullPath;
    }

    function undoLast() {
      if (waypoints.length === 0) return;
      waypoints.pop();
      const lastMarker = markers.pop();
      map.removeLayer(lastMarker);
      if (routeSegments.length > 0) routeSegments.pop();
      updateMap();
    }

    function clearAll() {
      waypoints = [];
      routeSegments = [];
      markers.forEach(m => map.removeLayer(m));
      markers = [];
      updateMap();
      document.getElementById('info').innerText = `0 km`;
      document.getElementById('status').innerText = `Kaart leeggemaakt.`;
    }

    function getOpgeslagenRoutes() {
      const data = localStorage.getItem('wandel_routes');
      return data ? JSON.parse(data) : {};
    }

    function slaRouteOp() {
      if (waypoints.length < 2) {
        alert("Maak eerst een route van minstens 2 knooppunten.");
        return;
      }

      const knooppuntenReeks = waypoints.map(w => w.ref).join('-');
      const standaardNaam = `Wandeling (${knooppuntenReeks}) - ${currentDistanceKm} km`;
      
      const routeNaam = prompt("Geef een naam voor deze wandelroute:", standaardNaam);
      if (!routeNaam || routeNaam.trim() === "") return;

      const routes = getOpgeslagenRoutes();
      routes[routeNaam.trim()] = {
        waypoints: waypoints,
        routeSegments: routeSegments,
        distanceKm: currentDistanceKm
      };

      localStorage.setItem('wandel_routes', JSON.stringify(routes));
      verversOpgeslagenRoutesLijst();
      document.getElementById('saved-routes-
